<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Programação em Python</title><desc id="d">Editor de código, terminal e gráfico.</desc><rect width="720" height="520" rx="28" fill="#f7faff"/><rect x="62" y="66" width="596" height="390" rx="25" fill="#132f4c"/><rect x="62" y="66" width="596" height="48" rx="25" fill="#1d4165"/><circle cx="93" cy="90" r="8" fill="#d0a13b"/><circle cx="119" cy="90" r="8" fill="#9ac6e8"/><circle cx="145" cy="90" r="8" fill="#fff" opacity=".7"/><text x="88" y="157" font-family="monospace" font-size="21" fill="#9ac6e8">import pandas as pd</text><text x="88" y="202" font-family="monospace" font-size="21" fill="#fff">dados = pd.read_excel(...)</text><text x="88" y="247" font-family="monospace" font-size="21" fill="#d0a13b">resultado = analisar(dados)</text><text x="88" y="292" font-family="monospace" font-size="21" fill="#fff">print(resultado)</text><rect x="88" y="327" width="250" height="92" rx="14" fill="#0b2138"/><text x="108" y="363" font-family="monospace" font-size="17" fill="#9ac6e8">$ python projeto.py</text><text x="108" y="396" font-family="monospace" font-size="17" fill="#fff">✓ execução concluída</text><path d="M412 402V276M412 402h190" stroke="#718ba5" stroke-width="3"/><path d="M428 382l38-43 37 17 42-69 41 23" fill="none" stroke="#9ac6e8" stroke-width="7" stroke-linecap="round"/><circle cx="545" cy="287" r="9" fill="#d0a13b"/></svg>