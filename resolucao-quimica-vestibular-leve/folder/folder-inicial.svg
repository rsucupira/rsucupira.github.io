<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Folder de aulas ao vivo de Química para vestibulares e ENEM</title>
  <desc id="desc">Folder bem-humorado com o título Antes de entrar em reação de pânico, descubra qual conceito não reagiu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCF5"/>
      <stop offset="1" stop-color="#E8F5E8"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69D39B"/>
      <stop offset="1" stop-color="#25885B"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B52"/>
      <stop offset="1" stop-color="#F06F3E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#12372A" flood-opacity=".16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#12372A" flood-opacity=".13"/>
    </filter>
    <clipPath id="flaskClip">
      <path d="M728 495h82v126l139 224c27 44-5 101-57 101H646c-52 0-84-57-57-101l139-224V495z"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="1012" cy="116" r="180" fill="#DFF0E0" opacity=".9"/>
  <circle cx="76" cy="1124" r="210" fill="#FFF0DA" opacity=".75"/>

  <g opacity=".16" stroke="#20593F" stroke-width="4" fill="none">
    <path d="M932 180l45 26v52l-45 26-45-26v-52z"/>
    <circle cx="954" cy="231" r="8" fill="#20593F"/>
    <path d="M72 470l36-21 36 21v42l-36 21-36-21z"/>
    <path d="M120 1040h82m-41-41v82"/>
    <circle cx="992" cy="1058" r="17"/>
    <circle cx="946" cy="1018" r="10"/>
    <path d="M957 1027l23 20"/>
  </g>

  <g transform="translate(70 64)">
    <rect width="505" height="54" rx="27" fill="#173F31"/>
    <text x="252.5" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.8">AULA AO VIVO • VESTIBULAR • ENEM</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" fill="#173F31">
    <text x="70" y="196" font-size="62" letter-spacing="-2">ANTES DE ENTRAR EM</text>
    <text x="70" y="270" font-size="78" letter-spacing="-3" fill="#F06F3E">REAÇÃO DE PÂNICO,</text>
    <text x="70" y="344" font-size="62" letter-spacing="-2">DESCUBRA QUAL CONCEITO</text>
    <text x="70" y="418" font-size="78" letter-spacing="-3">NÃO REAGIU.</text>
  </g>

  <text x="70" y="468" fill="#3B5E50" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">Resolução de exercícios de Química para vestibulares e ENEM.</text>

  <g transform="translate(70 528)" filter="url(#shadow)">
    <rect width="500" height="358" rx="36" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="358" rx="7" fill="#F06F3E"/>
    <text x="44" y="62" font-family="Arial, Helvetica, sans-serif" fill="#173F31" font-size="26" font-weight="800">TALVEZ VOCÊ NÃO ODEIE QUÍMICA.</text>
    <text x="44" y="107" font-family="Arial, Helvetica, sans-serif" fill="#3B5E50" font-size="27" font-weight="600">
      <tspan x="44" dy="0">Talvez só tenha misturado</tspan>
      <tspan x="44" dy="40">estequiometria, pH e desespero</tspan>
      <tspan x="44" dy="40">no mesmo béquer.</tspan>
    </text>
    <line x1="44" y1="245" x2="450" y2="245" stroke="#DCE8DF" stroke-width="3"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#173F31">
      <circle cx="59" cy="284" r="12" fill="#69D39B"/>
      <path d="M53 284l5 5 9-11" fill="none" stroke="#173F31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="291">Traduzir o enunciado</text>
      <circle cx="59" cy="327" r="12" fill="#69D39B"/>
      <path d="M53 327l5 5 9-11" fill="none" stroke="#173F31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="334">Conectar conceito e cálculo</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <path d="M728 495h82v126l139 224c27 44-5 101-57 101H646c-52 0-84-57-57-101l139-224V495z" fill="#FFFFFF" stroke="#173F31" stroke-width="14" stroke-linejoin="round"/>
    <rect x="712" y="470" width="114" height="44" rx="16" fill="#173F31"/>
    <g clip-path="url(#flaskClip)">
      <path d="M568 795c72-38 132 27 204-7 78-37 140 24 208-10v192H568z" fill="url(#liquid)"/>
      <g fill="#D9FFE8" opacity=".75">
        <circle cx="696" cy="854" r="15"/>
        <circle cx="822" cy="821" r="12"/>
        <circle cx="867" cy="875" r="19"/>
        <circle cx="760" cy="908" r="10"/>
        <circle cx="640" cy="900" r="8"/>
      </g>
    </g>
    <path d="M664 715h219" stroke="#D5E6DC" stroke-width="9" stroke-linecap="round"/>
    <path d="M638 762h271" stroke="#D5E6DC" stroke-width="9" stroke-linecap="round"/>

    <g filter="url(#smallShadow)" font-family="Arial, Helvetica, sans-serif" font-weight="900">
      <g transform="translate(584 570) rotate(-8)">
        <rect width="120" height="70" rx="18" fill="#FFDEAF"/>
        <text x="60" y="45" text-anchor="middle" font-size="29" fill="#6A431E">MOL</text>
      </g>
      <g transform="translate(850 570) rotate(8)">
        <rect width="120" height="70" rx="18" fill="#CDEBFF"/>
        <text x="60" y="45" text-anchor="middle" font-size="29" fill="#204C6A">pH</text>
      </g>
      <g transform="translate(896 690) rotate(11)">
        <rect width="128" height="70" rx="18" fill="#FFE2E0"/>
        <text x="64" y="45" text-anchor="middle" font-size="27" fill="#7A3030">NOX</text>
      </g>
      <g transform="translate(578 692) rotate(-10)">
        <rect width="164" height="70" rx="18" fill="#E4D9FF"/>
        <text x="82" y="45" text-anchor="middle" font-size="23" fill="#4C3877">LIGAÇÕES</text>
      </g>
    </g>

    <circle cx="735" cy="855" r="10" fill="#173F31"/>
    <circle cx="809" cy="855" r="10" fill="#173F31"/>
    <path d="M744 898c17-17 39-17 56 0" fill="none" stroke="#173F31" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(608 955)" filter="url(#smallShadow)">
    <path d="M0 24C0 11 11 0 24 0h336c13 0 24 11 24 24v86c0 13-11 24-24 24H122l-47 38 9-38H24c-13 0-24-11-24-24z" fill="#173F31"/>
    <text x="192" y="49" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
      <tspan x="192" dy="0">“A conta deu um elemento novo...”</tspan>
      <tspan x="192" dy="35" fill="#A8E0BC">Vamos conferir antes de publicar.</tspan>
    </text>
  </g>

  <g transform="translate(70 1032)">
    <rect width="500" height="126" rx="28" fill="#E7F4E9" stroke="#BFDCC7" stroke-width="3"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#173F31">
      <text x="28" y="42" font-size="20" font-weight="900" letter-spacing="1.4">NA AULA AO VIVO</text>
      <text x="28" y="80" font-size="23" font-weight="700">Questões reais • passo a passo • revisão dos erros</text>
      <text x="28" y="110" font-size="20" font-weight="600" fill="#3B5E50">Química geral, físico-química e orgânica.</text>
    </g>
  </g>

  <g transform="translate(70 1196)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#173F31">TRAGA A QUESTÃO QUE NÃO REAGIU.</text>
    <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#3B5E50">Vamos descobrir juntos onde a resolução travou.</text>
    <g transform="translate(650 -42)" filter="url(#smallShadow)">
      <rect width="360" height="82" rx="24" fill="url(#orange)"/>
      <text x="180" y="51" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">VAMOS RESOLVER AO VIVO</text>
    </g>
  </g>

  <line x1="70" y1="1296" x2="1010" y2="1296" stroke="#C9DCCF" stroke-width="2"/>
  <text x="70" y="1330" fill="#173F31" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">RODRIGO DE CARVALHO</text>
  <text x="1010" y="1330" text-anchor="end" fill="#3B5E50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">rsucupira.github.io/resolucao-quimica-vestibular-leve/</text>
</svg>