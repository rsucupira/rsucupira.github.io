<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t d"><title id="t">Python para Finanças</title><desc id="d">Painel com código Python, série de preços, métricas de risco e portfólio.</desc><rect width="720" height="520" rx="28" fill="#f6f9fd"/><rect x="48" y="48" width="624" height="424" rx="24" fill="#fff" stroke="#cddbea" stroke-width="3"/><rect x="48" y="48" width="624" height="52" rx="24" fill="#102d4c"/><circle cx="82" cy="74" r="7" fill="#c69a3a"/><circle cx="105" cy="74" r="7" fill="#8fb8d7"/><circle cx="128" cy="74" r="7" fill="#d9e5ef"/><text x="154" y="81" font-family="Arial,sans-serif" font-size="16" fill="#fff">portfolio_research.py</text><rect x="76" y="126" width="264" height="300" rx="18" fill="#102d4c"/><text x="98" y="158" font-family="monospace" font-size="15" fill="#9bc7e7">import pandas as pd</text><text x="98" y="188" font-family="monospace" font-size="15" fill="#fff">returns = prices.pct_change()</text><text x="98" y="218" font-family="monospace" font-size="15" fill="#c69a3a">vol = returns.std()</text><text x="98" y="248" font-family="monospace" font-size="15" fill="#fff">drawdown = equity / peak - 1</text><text x="98" y="278" font-family="monospace" font-size="15" fill="#9bc7e7">weights = optimize(risk)</text><text x="98" y="326" font-family="monospace" font-size="14" fill="#7ea7c7"># validate assumptions</text><text x="98" y="354" font-family="monospace" font-size="14" fill="#7ea7c7"># document decisions</text><rect x="372" y="126" width="270" height="178" rx="18" fill="#eef4fa" stroke="#b9cde0" stroke-width="2"/><path d="M396 267L431 244L466 252L502 203L538 220L574 169L618 183" fill="none" stroke="#1f659e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M396 278H618M396 238H618M396 198H618M396 158H618" stroke="#d4e1ed" stroke-width="2"/><text x="394" y="151" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102d4c">EQUITY · RETURNS</text><rect x="372" y="326" width="126" height="100" rx="16" fill="#fff6df" stroke="#c69a3a" stroke-width="2"/><text x="391" y="354" font-family="Arial,sans-serif" font-size="13" fill="#80652d">MAX DRAWDOWN</text><text x="391" y="393" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#102d4c">−12.4%</text><rect x="516" y="326" width="126" height="100" rx="16" fill="#eef4fa" stroke="#1f659e" stroke-width="2"/><text x="535" y="354" font-family="Arial,sans-serif" font-size="13" fill="#5e7186">VOLATILITY</text><text x="535" y="393" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#102d4c">14.8%</text></svg>